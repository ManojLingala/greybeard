<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="greybeard — paranoid about the right things. The seven-rung ladder.">
<rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="#0d1117" stroke="#21262d"/>
