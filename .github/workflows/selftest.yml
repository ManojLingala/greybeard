name: greybeard self-test

on:
  push:
  pull_request:

jobs:
  grader-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the deterministic grader
        run: node benchmarks/selftest.js
